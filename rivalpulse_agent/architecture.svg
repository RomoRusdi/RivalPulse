<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">RivalPulse Agent Architecture</title>
  <desc id="desc">Architecture diagram showing the flow from the command line through Sectors v2 data, deterministic analysis, evidence validation, Ollama synthesis, and grounded output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="1" stop-color="#111c2f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21d4c2"/>
      <stop offset="1" stop-color="#1598d4"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d5ce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#6f839f"/>
    </marker>
    <style>
      .title { font: 700 42px Inter,Segoe UI,Arial,sans-serif; fill: #f5f8fc; letter-spacing: -.8px }
      .subtitle { font: 400 18px Inter,Segoe UI,Arial,sans-serif; fill: #8fa2ba }
      .eyebrow { font: 700 13px Inter,Segoe UI,Arial,sans-serif; fill: #59d9cb; letter-spacing: 2.2px }
      .section { font: 700 14px Inter,Segoe UI,Arial,sans-serif; fill: #8296b0; letter-spacing: 1.5px }
      .box-title { font: 700 21px Inter,Segoe UI,Arial,sans-serif; fill: #f3f7fb }
      .box-copy { font: 400 15px Inter,Segoe UI,Arial,sans-serif; fill: #aebdd0 }
      .small { font: 500 13px Inter,Segoe UI,Arial,sans-serif; fill: #8296b0 }
      .chip { font: 700 12px Inter,Segoe UI,Arial,sans-serif; fill: #bff9ef; letter-spacing: .8px }
      .line { fill: none; stroke: #6f839f; stroke-width: 2.5; marker-end: url(#arrow) }
      .dash { fill: none; stroke: #52647d; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow) }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="230" fill="#18b7aa" opacity=".055"/>
  <circle cx="100" cy="930" r="260" fill="#7c64ef" opacity=".055"/>

  <text x="80" y="72" class="eyebrow">SYSTEM MAP · LIVE DATA MODE</text>
  <text x="80" y="124" class="title">RivalPulse agent architecture</text>
  <text x="80" y="158" class="subtitle">Evidence-grounded competitive intelligence with Sectors v2 data and local LLM reasoning</text>

  <rect x="80" y="205" width="1440" height="695" rx="28" fill="#0d1727" stroke="#25344a"/>

  <text x="115" y="247" class="section">REQUEST</text>
  <text x="390" y="247" class="section">DATA ACQUISITION</text>
  <text x="775" y="247" class="section">DETERMINISTIC INTELLIGENCE</text>
  <text x="1260" y="247" class="section">RESPONSE</text>

  <!-- Request -->
  <g filter="url(#shadow)">
    <rect x="115" y="285" width="215" height="132" rx="18" fill="#142238" stroke="#30435e"/>
    <circle cx="147" cy="319" r="9" fill="#21d4c2"/>
    <text x="169" y="326" class="box-title">User + CLI</text>
    <text x="140" y="360" class="box-copy">research · ask · chat</text>
    <text x="140" y="386" class="small">Target and competitor scope</text>
  </g>

  <!-- Data -->
  <g filter="url(#shadow)">
    <rect x="390" y="285" width="305" height="132" rx="18" fill="#142238" stroke="#2e7e82"/>
    <rect x="414" y="306" width="78" height="24" rx="12" fill="#123d42"/>
    <text x="430" y="323" class="chip">LIVE</text>
    <text x="414" y="359" class="box-title">Sectors v2 adapter</text>
    <text x="414" y="386" class="box-copy">Profiles · financials · news</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="455" width="305" height="112" rx="18" fill="#121e31" stroke="#30435e"/>
    <text x="414" y="493" class="box-title">In-memory TTL cache</text>
    <text x="414" y="520" class="box-copy">Deduplicates requests for 15 min</text>
    <text x="414" y="545" class="small">No snapshot file required</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="605" width="305" height="132" rx="18" fill="#142238" stroke="#30435e"/>
    <text x="414" y="647" class="box-title">Normalized contract</text>
    <text x="414" y="676" class="box-copy">Provider-neutral Pydantic models</text>
    <text x="414" y="704" class="small">Values retain source references</text>
  </g>

  <!-- Intelligence -->
  <g filter="url(#shadow)">
    <rect x="775" y="285" width="315" height="112" rx="18" fill="#142238" stroke="#30435e"/>
    <text x="799" y="326" class="box-title">Planner + collector</text>
    <text x="799" y="354" class="box-copy">Build scope and fetch concurrently</text>
    <text x="799" y="379" class="small">Missing data becomes a warning</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="775" y="435" width="315" height="112" rx="18" fill="#142238" stroke="#30435e"/>
    <text x="799" y="476" class="box-title">Numeric analyzer</text>
    <text x="799" y="504" class="box-copy">Comparisons and traceable evidence</text>
    <text x="799" y="529" class="small">No LLM calculations</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="775" y="585" width="315" height="112" rx="18" fill="#142238" stroke="#30435e"/>
    <text x="799" y="626" class="box-title">Signal detector</text>
    <text x="799" y="654" class="box-copy">Thresholds · confidence · impact</text>
    <text x="799" y="679" class="small">Evidence IDs required</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="775" y="735" width="315" height="112" rx="18" fill="#142238" stroke="#6f5bd0"/>
    <text x="799" y="776" class="box-title">Ollama synthesis</text>
    <text x="799" y="804" class="box-copy">Interprets supplied evidence only</text>
    <text x="799" y="829" class="small">qwen3.8:27b · local execution</text>
  </g>

  <!-- Response -->
  <g filter="url(#shadow)">
    <rect x="1170" y="435" width="315" height="190" rx="20" fill="url(#violet)" opacity=".92"/>
    <text x="1200" y="480" class="box-title">Grounded answer</text>
    <text x="1200" y="516" class="box-copy" fill="#e5e0ff">• Competitive summary</text>
    <text x="1200" y="545" class="box-copy" fill="#e5e0ff">• Signals and implications</text>
    <text x="1200" y="574" class="box-copy" fill="#e5e0ff">• Evidence and sources</text>
    <text x="1200" y="603" class="box-copy" fill="#e5e0ff">• Caveats for missing data</text>
  </g>

  <!-- Arrows -->
  <path d="M330 351H375" class="line"/>
  <path d="M543 417V440" class="line"/>
  <path d="M543 567V590" class="line"/>
  <path d="M695 671H740V341H760" class="line"/>
  <path d="M932 397V420" class="line"/>
  <path d="M932 547V570" class="line"/>
  <path d="M932 697V720" class="line"/>
  <path d="M1090 791H1135V608H1155" class="line"/>
  <path d="M1090 491H1155" class="dash"/>

  <!-- Trust boundary -->
  <rect x="745" y="265" width="375" height="602" rx="24" fill="none" stroke="#7565d4" stroke-width="2" stroke-dasharray="9 8" opacity=".7"/>
  <rect x="835" y="250" width="196" height="28" rx="14" fill="#242248"/>
  <text x="857" y="269" class="chip" fill="#d8d1ff">GROUNDED PIPELINE</text>

  <!-- Footer legend -->
  <line x1="80" y1="936" x2="1520" y2="936" stroke="#25344a"/>
  <circle cx="95" cy="968" r="6" fill="#21d4c2"/>
  <text x="112" y="973" class="small">External live data</text>
  <circle cx="290" cy="968" r="6" fill="#8874ec"/>
  <text x="307" y="973" class="small">Local reasoning</text>
  <text x="1520" y="973" text-anchor="end" class="small">Sectors is core · timestamps and evidence references remain visible</text>
</svg>
