<text x="1384" y="814" font-size="12" font-weight="700" fill="#7a5c11">Hard limits on every run</text>
<text x="1384" y="834" font-size="10" fill="#8a6d1c">&#8226; 180 s deadline, 3 attempts max</text>
<text x="1384" y="849" font-size="10" fill="#8a6d1c">&#8226; 12 external calls, 16 credits</text>
<text x="1384" y="864" font-size="10" fill="#8a6d1c">&#8226; fewer than 3 LLM calls</text>
<text x="1384" y="879" font-size="10" fill="#8a6d1c">&#8226; credits reserved before the call</text>
