x-app: &app
  build: .
  env_file: .env
  environment:
    MODE: live
    LLM_PLAN_ENABLED: ${LLM_PLAN_ENABLED:-false}
    RUN_TIMEOUT: "360"
    DATABASE_URL: postgresql+psycopg://rivalpulse:rivalpulse@postgres:5432/rivalpulse
    REDIS_URL: redis://redis:6379/0
    OLLAMA_BASE_URL: http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: rivalpulse
      POSTGRES_USER: rivalpulse
      POSTGRES_PASSWORD: rivalpulse
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivalpulse -d rivalpulse"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
  seed:
    <<: *app
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["python", "-m", "app.jobs"]
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
  reconciler:
    <<: *app
    command: ["python", "-m", "app.jobs", "reconcile"]
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
  frontend-proxy:
    image: nginx:1.27.5-alpine
    profiles: ["frontend"]
    ports: ["127.0.0.1:8080:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
