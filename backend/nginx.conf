server {
    listen 80;
    client_max_body_size 32k;

    # Re-resolve Compose and host addresses after a service is rebuilt. Without
    # variables Nginx keeps the container IP it saw at startup and returns 502
    # when Docker replaces the API container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $frontend_upstream http://host.docker.internal:3000;

    location /backend/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 620s;
    }
    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
